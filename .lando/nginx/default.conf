server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate     /certs/cert.crt;
  ssl_certificate_key /certs/cert.key;

  root  /app;
  index index.html;

  charset utf-8;
  error_page 404 /404.html;

  # Ingen cache under utveckling så att CSS/JS-ändringar syns direkt.
  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header Pragma "no-cache" always;

  # Rätt MIME för webp/svg
  types {
    text/html                 html;
    text/css                  css;
    application/javascript    js;
    image/webp                webp;
    image/svg+xml             svg;
    image/jpeg                jpg jpeg;
    image/png                 png;
    application/json          json;
    text/plain                txt;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Dölj Lando-konfiguration
  location ~ ^/\.lando { return 404; }
}
